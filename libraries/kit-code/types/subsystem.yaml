type: subsystem
role: concept
description: "One owned system, read at the pin: responsibilities, entry points, state, invariants, failure modes; anchored to the directory it covers."
use_when: A coherent component with its own boundaries and behaviour, described from its code at one commit.
avoid_when: "Whole-system views (architecture-overview), cross-cutting mechanisms (concept), or a directory listing (source-map)."
abstract: true
fragments: [anchored]
sections:
  list:
    - { heading: Responsibilities, min: 1, max: 1 }
    - { heading: Entry points, min: 1, max: 1 }
    - { heading: State, min: 1, max: 1 }
    - { heading: Invariants, min: 1, max: 1 }
    - { heading: Failure modes, min: 1, max: 1 }
    - heading: Relations
      min: 1
      require:
        - { labels: [mapped-in], min: 1 }
        - { labels: [part-of], min: 1 }
