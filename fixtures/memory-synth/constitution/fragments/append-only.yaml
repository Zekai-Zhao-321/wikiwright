fragment: append-only
description: "The page is append-only as a whole: a later change adds lines after the body and never edits one above."
rules:
  - id: body-append-only
    expr: "!before.present || (page.body.trim() + \"\\n\").startsWith(before.page.body.trim() + \"\\n\")"
    severity: error
    message: "This page is append-only: its body before this change is a prefix of its body after it; record a correction as a new dated line."
